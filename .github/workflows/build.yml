name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, Win32]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -S "${{ github.workspace }}" -B "${{ env.BUILD_DIR }}" -G "Visual Studio 18 2026" -A "${{ matrix.platform }}"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.configuration }} --parallel

      - name: Upload test executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterMathTests-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ${{ env.BUILD_DIR }}/tests/${{ matrix.configuration }}/AfterMathTests.exe
          if-no-files-found: ignore
